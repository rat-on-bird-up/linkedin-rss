name: Build feeds

on:
  schedule:
    # 07:00 UTC every Sunday. GitHub's scheduler drifts under load, so treat
    # this as "some time Sunday morning" rather than an exact clock time.
    - cron: "0 7 * * 0"
  push:
    branches: [main]
    # Only a config change rebuilds. Without this filter, every commit to the
    # repo would spend Apify credit, including the job's own feed commits.
    paths:
      - "sources/**"
  workflow_dispatch: # rebuild everything by hand from the Actions tab

permissions:
  contents: write # needed to commit the regenerated feeds back to the repo

concurrency:
  group: build-feeds
  cancel-in-progress: false # never kill a run midway through writing a feed

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # each source may wait up to 300s for its actor
    steps:
      # v4/v5 of these ran on Node 20, which GitHub deprecated and was already
      # force-running on Node 24. When that bridge is withdrawn the weekly build
      # starts failing, and a failing build here looks like a feed going quiet.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need history to diff the whole pushed range

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the regression tests
        # No network, a couple of seconds. Every case here is a fault that once
        # lost or corrupted a feed, so this runs before anything is spent.
        run: python scripts/test_build_feed.py

      - name: Work out which sources to build
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ]; then
            echo "Scheduled or manual run: building every source."
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Diff the WHOLE pushed range, not HEAD^..HEAD. A push can carry
          # several commits, and a source changed in any but the last one would
          # otherwise never be built.
          if [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Cannot resolve the previous tip: building every source."
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Names are filtered to the slug charset here as well as in Python,
          # because this value is expanded by a shell that holds APIFY_TOKEN.
          changed=$(git diff --name-only "$BEFORE" "$AFTER" -- 'sources/*.json' \
                    | sed -n 's#^sources/\(.*\)\.json$#\1#p' \
                    | grep -E '^[a-z0-9][a-z0-9-]{0,63}$' \
                    | sort -u | tr '\n' ' ' || true)
          if [ -z "$changed" ]; then
            echo "No source config changed. Building every source."
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "Changed sources: $changed"
            echo "args=--only $changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the feeds
        id: build
        continue-on-error: true # a broken source must not discard healthy feeds
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Through the environment, never interpolated straight into the
          # command line: an expression there is expanded by the shell before
          # Python ever sees it, in a step that holds the Apify token.
          ONLY: ${{ steps.scope.outputs.args }}
        run: python scripts/build_feed.py $ONLY

      - name: Commit whatever was rebuilt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage before diffing: a brand new source's docs/<slug>.xml is
          # untracked, and untracked paths are invisible to `git diff`, so
          # checking the unstaged diff would skip the commit that creates it.
          git add -A -- docs/ ':!docs/*.tmp'
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update feeds ($(date -u +%Y-%m-%d)) [skip ci]"
            git push || {
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
              git push
            }
          fi

      - name: Report the build result
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "::error::One or more sources failed. Healthy feeds were still committed. See docs/status.json."
            exit 1
          fi
          echo "All sources built."
